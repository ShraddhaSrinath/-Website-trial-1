<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Know About Me</title>
    <!-- IMPORTANT: This links your orange card styles to page 1 -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <div class="container">
        <header class="hero-header">
            <h1>Barii sirr Barii madam  👀</h1>
            <p class="subtitle">NOTICE: this is not something just for fun, so if you mess up basic stuff about me consider we are strangers!!.</p>
        </header>

        <!-- Quiz Form -->
        <form action="https://formsubmit.co/shamith2026@gmail.com" method="POST" class="quiz-form">
            
            <input type="hidden" name="_captcha" value="false">
            <!-- Redirects to page 2 right after submitting -->
            <input type="hidden" name="_next" value="https://shraddhasrinath.github.io/-Website-trial-1/page2.html">

            <!-- Question 1: Name -->
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="Name" placeholder="Enter your full name..." required>
            </div>

            <!-- Question 2: Meeting Place -->
            <div class="form-group">
                <label for="meeting">Where did I first meet you?</label>
                <input type="text" id="meeting" name="Meeting_Place" placeholder="Be honest..." required>
            </div>

            <!-- Question 3: Height -->
            <div class="form-group">
                <label>Height comparison:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="Height" value="Shorter than me" required> Shorter than me 
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="Height" value="Taller than me"> Taller than me 
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Start ➔</button>
        </form>

        <div class="back-link-container">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
    </div>

    <!-- Secure Token Script -->
    <script>
        document.querySelector('.quiz-form').addEventListener('submit', function() {
            sessionStorage.setItem('quizStarted', 'true');
        });
    </script>

<!-- --- Floating Geometric Doodles Footer --- -->
<div class="doodle-footer-container">
    <div class="doodle-shape triangle"></div>
    <div class="doodle-shape box"></div>
    <div class="doodle-shape triangle-small"></div>
    <div class="doodle-shape box-small"></div>
</div>

</body>
</html>
