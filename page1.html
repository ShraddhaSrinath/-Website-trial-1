<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Know About Me</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <div class="container">
        <header class="hero-header">
            <h1>Oh Neeva Banni Banni (broski who are you?) 👀</h1>
            <p class="Hey, this is genuinely not a joke, these are basic stuff about me and if you get these wrong andre ashte consider us strangers".</p>
        </header>

        <!-- Quiz Form enclosed in a Light Orange Card -->
        <form action="https://formsubmit.com/shamith2026@gmail.com" method="POST" class="quiz-form question-card">
            
            <input type="hidden" name="_captcha" value="false">
            <!-- Redirects straight to page 3 -->
            <input type="hidden" name="_next" value="https://shraddhasrinath.github.io/-Website-trial-1/page3.html">

            <!-- Question Card Header / Instructions -->
            <h2 class="question-title">Player Identification 📝</h2>

            <!-- Question 1: Name -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="name" class="food-name">Your Name:</label>
                <input type="text" id="name" name="Name" placeholder="Enter your full name..." class="text-input-card" required>
            </div>

            <!-- Question 2: Meeting Place -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="meeting" class="food-name">Where did I first meet you?</label>
                <input type="text" id="meeting" name="Meeting_Place" placeholder="Be honest..." class="text-input-card" required>
            </div>

            <!-- Question 3: Height -->
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="food-name">Height comparison:</label>
                <div class="options-group">
                    <label class="custom-radio">
                        <input type="radio" name="Height" value="Shorter than me" required>
                        <span class="radio-box">Shorter than me 📉</span>
                    </label>
                    <label class="custom-radio">
                        <input type="radio" name="Height" value="Taller than me">
                        <span class="radio-box">Taller than me 📈</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Start ➔</button>
        </form>

        <div class="back-link-container">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
    </div>

    <!-- Floating Geometric Doodles Footer -->
    <div class="doodle-footer-container">
        <div class="doodle-shape triangle"></div>
        <div class="doodle-shape box"></div>
        <div class="doodle-shape triangle-small"></div>
        <div class="doodle-shape box-small"></div>
    </div>
</body>
</html>
